<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Minimal AI Task Tracker</title>
    <link rel="manifest" href="data:application/json,{\"name\":\"Task Tracker\",\"short_name\":\"Tasks\",\"start_url\":\".\",\"display\":\"standalone\",\"background_color\":\"#000000\",\"theme_color\":\"#000000\"}">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #09090b; color: #f4f4f5; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        .recording-pulse { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen flex flex-col justify-between p-4 pb-8">

    <!-- Top Navigation & Calendar -->
    <div>
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-xl font-bold tracking-tight">Daily Tasks</h1>
            <input type="date" id="datePicker" onchange="changeDate()" class="bg-zinc-800 text-sm text-zinc-200 px-3 py-1.5 rounded-lg border border-zinc-700 outline-none">
        </div>

        <!-- Smart Assistant Greeting Box -->
        <div class="bg-zinc-900 border border-zinc-800 p-4 rounded-xl mb-4">
            <div class="flex items-center gap-2 text-xs font-semibold text-purple-400 mb-1">
                <span>✦</span> <span>AI ASSISTANT</span>
            </div>
            <p id="aiGreeting" class="text-sm text-zinc-300">Tap the mic or type to dictate all your tasks for today at once.</p>
        </div>

        <!-- Missed Tasks Alert Section -->
        <div id="missedTasksSection" class="hidden bg-amber-950/40 border border-amber-800/50 p-3 rounded-xl mb-4">
            <p class="text-xs text-amber-400 font-semibold mb-2">⚠️ Unfinished tasks from previous days:</p>
            <div id="missedList" class="space-y-2"></div>
        </div>

        <!-- Tasks List -->
        <div id="taskList" class="space-y-2"></div>
    </div>

    <!-- Bottom Controls: Upgraded Voice & Prompt Entry -->
    <div class="pt-4 border-t border-zinc-800">
        <div id="recordingStatus" class="hidden text-xs text-red-400 font-medium mb-2 flex items-center gap-2 recording-pulse">
            <span class="w-2 h-2 rounded-full bg-red-500"></span> Listening... Speak your tasks clearly
        </div>

        <div class="flex items-center gap-2 mb-2">
            <button id="micBtn" onclick="toggleVoiceInput()" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-200 p-3.5 rounded-xl transition flex items-center justify-center">
                <span id="micIcon" class="text-lg">🎙️</span>
            </button>
            <textarea id="taskPromptInput" rows="2" placeholder="Tell me what you want to do today (e.g. workout at 9am, study math, and clean my room)..." class="flex-1 bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-zinc-600 resize-none"></textarea>
            <button onclick="processInputPrompt()" class="bg-white text-black font-semibold text-sm px-4 py-3 rounded-xl hover:bg-zinc-200 transition">
                Add
            </button>
        </div>

        <div class="flex items-center justify-between text-xs text-zinc-500 px-1">
            <label class="flex items-center gap-2 cursor-pointer">
                <input type="checkbox" id="photoToggle" class="rounded bg-zinc-900 border-zinc-800">
                <span>Require photo proof for these tasks</span>
            </label>
        </div>
    </div>

    <script>
        let selectedDate = new Date().toISOString().split('T')[0];
        let tasks = JSON.parse(localStorage.getItem('ai_tasks_v3') || '[]');
        let recognition = null;
        let isRecording = false;

        document.getElementById('datePicker').value = selectedDate;

        function saveTasks() {
            localStorage.setItem('ai_tasks_v3', JSON.stringify(tasks));
            render();
        }

        function changeDate() {
            selectedDate = document.getElementById('datePicker').value;
            render();
        }

        // --- UPGRADED VOICE RECOGNITION ENGINE ---
        function toggleVoiceInput() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Voice recognition is not supported in this browser. Please use Safari on iOS.");
                return;
            }

            const micBtn = document.getElementById('micBtn');
            const statusLabel = document.getElementById('recordingStatus');

            if (isRecording) {
                recognition.stop();
                return;
            }

            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            recognition.onstart = () => {
                isRecording = true;
                micBtn.classList.remove('bg-zinc-800');
                micBtn.classList.add('bg-red-600');
                statusLabel.classList.remove('hidden');
            };

            recognition.onresult = (event) => {
                let currentTranscript = '';
                for (let i = 0; i < event.results.length; i++) {
                    currentTranscript += event.results[i][0].transcript;
                }
                document.getElementById('taskPromptInput').value = currentTranscript;
            };

            recognition.onerror = (event) => {
                console.error("Speech error:", event.error);
                stopRecordingUI();
            };

            recognition.onend = () => {
                stopRecordingUI();
            };

            recognition.start();
        }

        function stopRecordingUI() {
            isRecording = false;
            const micBtn = document.getElementById('micBtn');
            const statusLabel = document.getElementById('recordingStatus');
            micBtn.classList.remove('bg-red-600');
            micBtn.classList.add('bg-zinc-800');
            statusLabel.classList.add('hidden');
        }

        // --- SMART MULTI-TASK PARSER (NO API KEY NEEDED) ---
        function processInputPrompt() {
            const text = document.getElementById('taskPromptInput').value.trim();
            if (!text) return;

            // Smart split rules for transition words: "and", "then", "also", commas, newlines
            const rawTasks = text.split(/,|\n|\b(?:and then|then|also|after that|and)\b/i);
            const photoRequired = document.getElementById('photoToggle').checked;

            let addedCount = 0;
            rawTasks.forEach(rawItem => {
                let cleanTitle = rawItem.trim();
                
                // Clean up leading common fluff like "I want to", "I need to", "today I have to"
                cleanTitle = cleanTitle.replace(/^(i want to|i need to|today i want to|today i need to|i have to|also|then)\s+/i, '');
                
                if (cleanTitle.length > 1) {
                    tasks.push({
                        id: Date.now() + Math.random(),
                        title: cleanTitle.charAt(0).toUpperCase() + cleanTitle.slice(1),
                        date: selectedDate,
                        completed: false,
                        needsPhoto: photoRequired,
                        photoUrl: null
                    });
                    addedCount++;
                }
            });

            document.getElementById('taskPromptInput').value = '';
            document.getElementById('photoToggle').checked = false;
            saveTasks();
        }

        function toggleTask(id) {
            const task = tasks.find(t => t.id === id);
            if (!task) return;

            if (task.needsPhoto && !task.completed && !task.photoUrl) {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = 'image/*';
                input.onchange = (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = () => {
                            task.photoUrl = reader.result;
                            task.completed = true;
                            saveTasks();
                        };
                        reader.readAsDataURL(file);
                    }
                };
                input.click();
            } else {
                task.completed = !task.completed;
                saveTasks();
            }
        }

        function rescheduleTask(id, targetDate) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.date = targetDate;
                saveTasks();
            }
        }

        function dropTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            saveTasks();
        }

        function render() {
            const list = document.getElementById('taskList');
            list.innerHTML = '';

            const todayTasks = tasks.filter(t => t.date === selectedDate);
            const today = new Date().toISOString().split('T')[0];

            // Render Missed Tasks Section
            const missedSection = document.getElementById('missedTasksSection');
            const missedList = document.getElementById('missedList');
            missedList.innerHTML = '';

            if (selectedDate === today) {
                const missed = tasks.filter(t => t.date < today && !t.completed);
                if (missed.length > 0) {
                    missedSection.classList.remove('hidden');
                    missed.forEach(task => {
                        const div = document.createElement('div');
                        div.className = 'flex justify-between items-center text-xs bg-zinc-900 p-2.5 rounded-lg border border-zinc-800';
                        div.innerHTML = `
                            <span class="text-zinc-300 truncate max-w-[150px]">${task.title}</span>
                            <div class="flex gap-1.5">
                                <button onclick="rescheduleTask(${task.id}, '${today}')" class="bg-blue-600 text-white px-2.5 py-1 rounded">Today</button>
                                <button onclick="dropTask(${task.id})" class="bg-red-900/60 text-red-300 px-2.5 py-1 rounded">Drop</button>
                            </div>
                        `;
                        missedList.appendChild(div);
                    });
                } else {
                    missedSection.classList.add('hidden');
                }
            } else {
                missedSection.classList.add('hidden');
            }

            // Render Today's Tasks
            if (todayTasks.length === 0) {
                list.innerHTML = `<p class="text-xs text-zinc-600 text-center py-8">No tasks scheduled for this day.</p>`;
            } else {
                todayTasks.forEach(task => {
                    const div = document.createElement('div');
                    div.className = `flex items-center justify-between p-3.5 rounded-xl border ${task.completed ? 'bg-zinc-950 border-zinc-900 text-zinc-600' : 'bg-zinc-900 border-zinc-800 text-zinc-200'}`;
                    div.innerHTML = `
                        <div class="flex items-center gap-3">
                            <button onclick="toggleTask(${task.id})" class="text-lg">
                                ${task.completed ? '✅' : '⭕'}
                            </button>
                            <span class="text-sm ${task.completed ? 'line-through' : ''}">${task.title}</span>
                        </div>
                        <div class="flex items-center gap-2">
                            ${task.needsPhoto ? `<span class="text-xs px-2 py-0.5 rounded bg-zinc-800 text-zinc-400">${task.photoUrl ? '📷 Verified' : '📷 Photo Needed'}</span>` : ''}
                            <button onclick="dropTask(${task.id})" class="text-xs text-zinc-600 hover:text-red-400 px-1">✕</button>
                        </div>
                    `;
                    list.appendChild(div);
                });
            }

            // Update AI Assistant Message
            const aiGreeting = document.getElementById('aiGreeting');
            const doneCount = todayTasks.filter(t => t.completed).length;
            if (todayTasks.length === 0) {
                aiGreeting.textContent = "Your schedule is empty for this day. Tap the mic or type to add what you want to do!";
            } else if (doneCount === todayTasks.length) {
                aiGreeting.textContent = `🎉 Fantastic! You completed all ${todayTasks.length} tasks scheduled for today.`;
            } else {
                aiGreeting.textContent = `You have completed ${doneCount} out of ${todayTasks.length} tasks for this day. Keep going!`;
            }
        }

        render();
    </script>
</body>
</html>
