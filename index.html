<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Minimal AI Task Tracker</title>
    <link rel="manifest" href="data:application/json,{\"name\":\"Task Tracker\",\"short_name\":\"Tasks\",\"start_url\":\".\",\"display\":\"standalone\",\"background_color\":\"#000000\",\"theme_color\":\"#000000\"}">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #09090b; color: #f4f4f5; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen flex flex-col justify-between p-4 pb-8">

    <!-- Top Navigation & Date Picker -->
    <div>
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-xl font-bold tracking-tight">AI Task Planner</h1>
            <input type="date" id="datePicker" onchange="changeDate()" class="bg-zinc-800 text-sm text-zinc-200 px-3 py-1.5 rounded-lg border border-zinc-700 outline-none">
        </div>

        <!-- AI Assistant Greeting Box -->
        <div class="bg-zinc-900 border border-zinc-800 p-4 rounded-xl mb-4">
            <div class="flex items-center justify-between mb-1">
                <div class="flex items-center gap-2 text-xs font-semibold text-purple-400">
                    <span>✦</span> <span>SMART AI ASSISTANT</span>
                </div>
                <button onclick="toggleApiKeyInput()" class="text-xs text-zinc-500 hover:text-zinc-300 underline">Configure Free AI Key</button>
            </div>
            <p id="aiGreeting" class="text-sm text-zinc-300">Type or prompt what you want to do today in one sentence.</p>
            
            <!-- Hidden API Key Input Box (Free from Google AI Studio) -->
            <div id="apiKeySection" class="hidden mt-3 pt-3 border-t border-zinc-800">
                <p class="text-xs text-zinc-400 mb-1">Enter your free Google Gemini API Key (saved locally on your phone only):</p>
                <div class="flex gap-2">
                    <input type="password" id="apiKeyInput" placeholder="Paste Gemini API key..." class="flex-1 bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-1.5 text-xs text-zinc-200">
                    <button onclick="saveApiKey()" class="bg-purple-600 text-white text-xs px-3 py-1.5 rounded-lg font-medium">Save</button>
                </div>
            </div>
        </div>

        <!-- Missed Tasks Alert Section -->
        <div id="missedTasksSection" class="hidden bg-amber-950/40 border border-amber-800/50 p-3 rounded-xl mb-4">
            <p class="text-xs text-amber-400 font-semibold mb-2">⚠️ Unfinished tasks from previous days:</p>
            <div id="missedList" class="space-y-2"></div>
        </div>

        <!-- Tasks List -->
        <div id="taskList" class="space-y-2"></div>
    </div>

    <!-- Bottom Controls: Smart Prompt Entry -->
    <div class="pt-4 border-t border-zinc-800">
        <div class="flex items-center gap-2 mb-2">
            <textarea id="taskPromptInput" rows="1" placeholder="E.g., I want to do workout at 9am, study math, and clean my room..." class="flex-1 bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-zinc-600 resize-none"></textarea>
            <button onclick="processSmartPrompt()" id="submitBtn" class="bg-white text-black font-semibold text-sm px-4 py-3 rounded-xl hover:bg-zinc-200 transition">
                Generate
            </button>
        </div>
        <div class="flex items-center justify-between text-xs text-zinc-500 px-1">
            <label class="flex items-center gap-2 cursor-pointer">
                <input type="checkbox" id="photoToggle" class="rounded bg-zinc-900 border-zinc-800">
                <span>Require photo proof for tasks</span>
            </label>
        </div>
    </div>

    <script>
        let selectedDate = new Date().toISOString().split('T')[0];
        let tasks = JSON.parse(localStorage.getItem('ai_smart_tasks') || '[]');
        let apiKey = localStorage.getItem('gemini_api_key') || '';

        document.getElementById('datePicker').value = selectedDate;
        if (apiKey) document.getElementById('apiKeyInput').value = apiKey;

        function saveTasks() {
            localStorage.setItem('ai_smart_tasks', JSON.stringify(tasks));
            render();
        }

        function toggleApiKeyInput() {
            const section = document.getElementById('apiKeySection');
            section.classList.toggle('hidden');
        }

        function saveApiKey() {
            apiKey = document.getElementById('apiKeyInput').value.trim();
            localStorage.setItem('gemini_api_key', apiKey);
            alert("API Key saved securely to your local browser storage!");
            toggleApiKeyInput();
        }

        function changeDate() {
            selectedDate = document.getElementById('datePicker').value;
            render();
        }

        // Send user prompt to Google Gemini Free Tier API to parse multiple tasks automatically
        async function processSmartPrompt() {
            const promptText = document.getElementById('taskPromptInput').value.trim();
            if (!promptText) return;

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.textContent = "...";

            if (!apiKey) {
                // Fallback smart parser if no API key is provided yet
                fallbackParser(promptText);
                submitBtn.textContent = "Generate";
                document.getElementById('taskPromptInput').value = '';
                return;
            }

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: `Extract distinct tasks from this user request: "${promptText}". Return ONLY a raw JSON array of strings, where each string is a clear independent task title. No formatting blocks, no markdown formatting like \`\`\`json, just the raw array format like ["Task 1", "Task 2"]`
                            }]
                        }]
                    })
                });

                const data = await response.json();
                let rawText = data.candidates[0].content.parts[0].text.trim();
                rawText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
                
                const extractedTasks = JSON.parse(rawText);
                const photoRequired = document.getElementById('photoToggle').checked;

                extractedTasks.forEach(title => {
                    tasks.push({
                        id: Date.now() + Math.random(),
                        title: title,
                        date: selectedDate,
                        completed: false,
                        needsPhoto: photoRequired,
                        photoUrl: null
                    });
                });

                document.getElementById('taskPromptInput').value = '';
                document.getElementById('photoToggle').checked = false;
                saveTasks();
            } catch (error) {
                alert("AI parsing error. Falling back to standard text entry. Check your API key.");
                fallbackParser(promptText);
            } finally {
                submitBtn.textContent = "Generate";
            }
        }

        // Fallback local splitter if user hasn't put an API key yet
        function fallbackParser(text) {
            const splitItems = text.split(/,|\n| and /i).map(t => t.trim()).filter(t => t.length > 0);
            const photoRequired = document.getElementById('photoToggle').checked;
            
            splitItems.forEach(title => {
                tasks.push({
                    id: Date.now() + Math.random(),
                    title: title,
                    date: selectedDate,
                    completed: false,
                    needsPhoto: photoRequired,
                    photoUrl: null
                });
            });
            saveTasks();
        }

        function toggleTask(id) {
            const task = tasks.find(t => t.id === id);
            if (!task) return;

            if (task.needsPhoto && !task.completed && !task.photoUrl) {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = 'image/*';
                input.onchange = (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = () => {
                            task.photoUrl = reader.result;
                            task.completed = true;
                            saveTasks();
                        };
                        reader.readAsDataURL(file);
                    }
                };
                input.click();
            } else {
                task.completed = !task.completed;
                saveTasks();
            }
        }

        function rescheduleTask(id, targetDate) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.date = targetDate;
                saveTasks();
            }
        }

        function dropTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            saveTasks();
        }

        function render() {
            const list = document.getElementById('taskList');
            list.innerHTML = '';

            const todayTasks = tasks.filter(t => t.date === selectedDate);
            const today = new Date().toISOString().split('T')[0];

            // Render Missed Tasks
            const missedSection = document.getElementById('missedTasksSection');
            const missedList = document.getElementById('missedList');
            missedList.innerHTML = '';

            if (selectedDate === today) {
                const missed = tasks.filter(t => t.date < today && !t.completed);
                if (missed.length > 0) {
                    missedSection.classList.remove('hidden');
                    missed.forEach(task => {
                        const div = document.createElement('div');
                        div.className = 'flex justify-between items-center text-xs bg-zinc-900 p-2 rounded-lg border border-zinc-800';
                        div.innerHTML = `
                            <span class="text-zinc-300 truncate max-w-[150px]">${task.title}</span>
                            <div class="flex gap-1">
                                <button onclick="rescheduleTask(${task.id}, '${today}')" class="bg-blue-600 text-white px-2 py-1 rounded">Tomorrow</button>
                                <button onclick="dropTask(${task.id})" class="bg-red-900/60 text-red-300 px-2 py-1 rounded">Drop</button>
                            </div>
                        `;
                        missedList.appendChild(div);
                    });
                } else {
                    missedSection.classList.add('hidden');
                }
            } else {
                missedSection.classList.add('hidden');
            }

            // Render Tasks
            if (todayTasks.length === 0) {
                list.innerHTML = `<p class="text-xs text-zinc-600 text-center py-8">No tasks scheduled for this day. Give the AI a prompt below!</p>`;
            } else {
                todayTasks.forEach(task => {
                    const div = document.createElement('div');
                    div.className = `flex items-center justify-between p-3 rounded-xl border ${task.completed ? 'bg-zinc-950 border-zinc-900 text-zinc-600' : 'bg-zinc-900 border-zinc-800 text-zinc-200'}`;
                    div.innerHTML = `
                        <div class="flex items-center gap-3">
                            <button onclick="toggleTask(${task.id})" class="text-lg">
                                ${task.completed ? '✅' : '⭕'}
                            </button>
                            <span class="text-sm ${task.completed ? 'line-through' : ''}">${task.title}</span>
                        </div>
                        <div class="flex items-center gap-2">
                            ${task.needsPhoto ? `<span class="text-xs px-2 py-0.5 rounded bg-zinc-800 text-zinc-400">📷 ${task.photoUrl ? 'Verified' : 'Photo Needed'}</span>` : ''}
                            <button onclick="dropTask(${task.id})" class="text-xs text-zinc-600 hover:text-red-400">✕</button>
                        </div>
                    `;
                    list.appendChild(div);
                });
            }

            // Update Greeting
            const aiGreeting = document.getElementById('aiGreeting');
            const doneCount = todayTasks.filter(t => t.completed).length;
            if (todayTasks.length === 0) {
                aiGreeting.textContent = "Your day is clear. Tell me what you want to achieve today in a single prompt.";
            } else if (doneCount === todayTasks.length) {
                aiGreeting.textContent = `🎉 Awesome! You completed all ${todayTasks.length} tasks for this day.`;
            } else {
                aiGreeting.textContent = `You finished ${doneCount} of ${todayTasks.length} tasks today. Keep pushing!`;
            }
        }

        render();
    </script>
</body>
</html>
